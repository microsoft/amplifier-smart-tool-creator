[project]
name = "amplifier-smart-tool-creator"
version = "0.1.1"
description = "A smart tool that helps you create, validate, and evaluate smart tools"
readme = "README.md"
authors = [
    { name = "David Koleczek", email = "45405824+DavidKoleczek@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0,<5.0.0",
    "pydantic>=2.13,<3.0",
    "python-liquid>=2.3.1,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "typer>=0.27.2,<0.28.0",
]

[project.scripts]
smart-tool-creator = "smart_tool_creator.cli:main"

[project.urls]
Repository = "https://github.com/microsoft/amplifier-smart-tool-creator"

[project.optional-dependencies]
copilot = [
    "github-copilot-sdk>=1.0.13,<2.0.0",
]
amplifier-agent = [
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@v0.20.0#subdirectory=packages/python",
]
all = [
    "amplifier-smart-tool-creator[copilot,amplifier-agent]",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smart_tool_creator"

[tool.uv]
add-bounds = "major"
default-groups = "all"
exclude-newer = "5 days"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.79",
]

[tool.ruff]
# Keep the shared, vendored website theme unchanged.
extend-exclude = ["site/theme", "_site"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.src]
exclude = ["site/theme", "_site"]
